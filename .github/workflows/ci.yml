name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swiftc --version
      - name: Test
        run: make test
      - name: Bundle and render docs
        run: make docs
      - name: Check bundle
        run: |
          APP="build/OpenChamber Mini Status.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "dev.openchamber.mini-status"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "1.0.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$APP/Contents/Info.plist")" = "true"
          lipo -info "$APP/Contents/MacOS/mini-status" | grep -q arm64
          lipo -info "$APP/Contents/MacOS/mini-status" | grep -q x86_64
          codesign --verify --deep --strict "$APP"
      - name: Check the install script
        run: |
          make dist
          MINI_STATUS_INSTALL_URL="file://$PWD/dist/OpenChamber-Mini-Status-1.0.0.zip" \
            bash scripts/install-from-release.sh
          test -d "$HOME/Applications/OpenChamber Mini Status.app"
